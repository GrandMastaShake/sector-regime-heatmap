[pytest]
# Collect ONLY this repo's tests.
#
# Two workflows -- daily-tape.yml and weekly_research_import.yml -- check the
# weekly-council-scan repo out into upstream/ and then run pytest from the
# root. Without this, pytest walks into upstream/tests and collects another
# repo's suite: wrong dependencies, wrong fixtures, and a signal that means
# nothing about this repo.
#
# It surfaced as a basename collision. Both repos have tests/test_workflows.py
# and neither tests/ is a package, so pytest derived the same module name for
# two different files and refused to collect:
#
#   import file mismatch: imported module 'test_workflows' has this __file__
#   ... which is not the same as the test file we want to collect
#
# The collision is what made it visible; collecting upstream at all was the
# actual bug, and it was latent in weekly_research_import.yml before the
# daily-tape job existed.
testpaths = tests
norecursedirs = upstream .git __pycache__ .pytest_cache
