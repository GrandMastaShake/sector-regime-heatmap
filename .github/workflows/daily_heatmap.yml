name: Heatmap
on:
  workflow_dispatch:
    inputs:
      run_type:
        required: true
        default: weekly_refresh
        type: choice
        options: [weekly_refresh, premarket, after_close]
concurrency:
  group: heatmap-weekly-refresh
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    if: inputs.run_type == 'weekly_refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - uses: actions/checkout@v4
        with: {repository: GrandMastaShake/weekly-council-scan, ref: be90446207590eea46fe482dae1826bbf67a76ff, path: upstream}
      - run: python src/import_weekly_research.py --source-root upstream --commit be90446207590eea46fe482dae1826bbf67a76ff --file-shas data/weekly_research/2026-08-24/source_file_shas.json --as-of-date 2026-08-24
      - run: git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git add data/weekly_research/2026-08-24 && (git diff --cached --quiet || git commit -m 'Import pinned weekly research snapshot 2026-08-24') && git push
