name: Weekly research import

# Imports a pinned, provenance-verified snapshot of the weekly-council-scan
# wiki. Manual only. The as-of date and upstream commit are inputs, not
# hardcoded, so this workflow is reusable every week.

on:
  workflow_dispatch:
    inputs:
      as_of_date:
        description: Snapshot date (YYYY-MM-DD), must match the data/weekly_research folder
        required: true
        type: string
      upstream_commit:
        description: Full 40-char weekly-council-scan commit SHA to pin
        required: true
        type: string

concurrency:
  group: weekly-research-import-${{ inputs.as_of_date }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Validate inputs
        run: |
          echo "${{ inputs.as_of_date }}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            || { echo "as_of_date must be YYYY-MM-DD"; exit 1; }
          echo "${{ inputs.upstream_commit }}" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "upstream_commit must be a full 40-char SHA"; exit 1; }
          test -f "data/weekly_research/${{ inputs.as_of_date }}/source_file_shas.json" \
            || { echo "No pinned SHA manifest for ${{ inputs.as_of_date }}"; exit 1; }

      - name: Preflight
        run: python scripts/preflight.py

      - name: Check out pinned upstream research
        uses: actions/checkout@v4
        with:
          repository: GrandMastaShake/weekly-council-scan
          ref: ${{ inputs.upstream_commit }}
          path: upstream
          persist-credentials: false

      - name: Import verified snapshot
        run: |
          python src/import_weekly_research.py \
            --source-root upstream \
            --commit "${{ inputs.upstream_commit }}" \
            --file-shas "data/weekly_research/${{ inputs.as_of_date }}/source_file_shas.json" \
            --as-of-date "${{ inputs.as_of_date }}"

      - name: Refresh the README dashboard
        run: python scripts/render_dashboard.py

      - name: Run tests against the imported snapshot
        run: python -m pytest -q

      - name: Commit snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/weekly_research/${{ inputs.as_of_date }}" README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import verified weekly research snapshot ${{ inputs.as_of_date }}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push attempt $i failed; retrying."
            sleep 5
          done
          echo "Could not push after 3 attempts."
          exit 1
