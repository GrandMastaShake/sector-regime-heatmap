version: 1

# Sector excess return by regime archetype, in percentage points against SPY
# over the full episode. Transcribed from the published regime-sector matrix
# (24 episodes, 1998-2026, 10 archetypes).
#
# THIS IS A PRIOR, NOT A FORECAST. It records what a sector did in past
# episodes of the same archetype. It is displayed beside the live arithmetic
# and never mixed into a score: src/heatmap.py scores five components and this
# is none of them. `regime_fit` is the judgment component where a human decides
# how much weight this prior deserves this time, and that decision is exactly
# what must not be automated away.
#
# Precision: whole points, as the published matrix reports them. A handful of
# episodes are cited to one decimal in prose elsewhere (Technology in the
# bubble unwind is -34.0, Consumer Staples +44.6, Financials in a credit
# crisis -19.9); those round to the values here and the extra digit is not
# carried, because the n per cell is 1-4 and a tenth of a point implies a
# precision the sample cannot support.
#
# n/a: the sector ETF did not exist for that episode. XLRE listed October 2015
# and XLC June 2018, so neither has a dot-com-era observation. Absent, not zero
# -- a null here must never be read as "no excess return".
#
# Sample sizes per archetype are in config/regime_archetypes.yaml. Several are
# n=1. Read accordingly.

